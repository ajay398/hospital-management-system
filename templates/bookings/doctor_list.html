<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>
</head>
<body>

<h1>Doctors</h1>

{% for doctor in doctors %}

<div>

    <h3>Dr. {{ doctor.username }}</h3>

    <a href="/bookings/slots/{{ doctor.id }}/">
        View Slots
    </a>

</div>

<hr>

{% empty %}

<p>No doctors available.</p>

{% endfor %}

</body>
</html>
